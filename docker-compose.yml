services:
  postgres:
    image: postgres:16-alpine
    container_name: errands_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: errands
      POSTGRES_PASSWORD: errands_dev_password
      POSTGRES_DB: errands_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: errands_redis
    restart: unless-stopped
    command: redis-server --requirepass errands_redis_password
    ports:
      - '6379:6379'

  mailhog:
    image: mailhog/mailhog
    container_name: errands_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # Web UI → http://localhost:8025

volumes:
  postgres_data:
